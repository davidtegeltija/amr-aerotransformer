# =============================================================================
# baseline.yaml — reference MODEL config (all available keys)
# =============================================================================
# Runnable as-is as a deterministic_transformer. Other branches are commented below.
# A run is two files (config and data):
#   python main.py --config configs/baseline.yaml --data configs/data/wing.yaml


# ---- Model ----
model_trained: deterministic_transformer      # deterministic_transformer | learned_transformer | scorer | vit
d_model: 256                                  # Token embedding width. It also sets the LR schedule scale under schedule=noam
n_layers: 4                                   # Encoder blocks
n_heads: 8                                    # Attention heads (must divide d_model)
d_ff: 512                                     # Feed-forward inner width
dropout: 0.2                  
min_patch_size: 1                             # Smallest allowed leaf patch (pixels). Fine cap — sole limit on the deepest refinement
max_patch_size: 16                            # Largest allowed leaf patch (pixels). Coarse floor — every region is refined at least this far
affine_input: true                            # Per-token mean + gx + gy of the geometry channels, instead of the mean alone
affine_output: 2                              # Per-cell polynomial order, dense per-pixel loss: 0 constant | 1 value+gx+gy | 2 also gxx+gxy+gyy
refinement_criteria: AERODYNAMIC_CRITERIA_2   # Key in CRITERIA_REGISTRY (src/amr/refinement_criteria.py)


# ---- Training ----
epochs: 250
batch_size: 8
warmup_steps: 1000                            # LR warm-up steps (transformer branches only)
schedule: cosine                              # cosine (AdamW + warmup + cosine decay) | noam (Adam + inverse-sqrt)
lr: 0.001                                     # Peak learning rate. Ignored under schedule=noam, whose peak is fixed by d_model
weight_decay: 0.01                            # AdamW decay, matrix params only. Ignored under schedule=noam
num_workers: 0                                # DataLoader workers. Only 0 keeps the AMR collates' per-sample mesh cache across epochs


# ---- learned_transformer (replaces refinement_criteria) ----
# offset: 0.0                                                                        # Mesh budget: split iff mean(d_pred) > d + offset. Positive coarser, negative finer
# checkpoint_file: "outputs/checkpoints/2026-07-16_scorer_supervised_cavity.pt"      # Required: the trained scorer whose depth map defines the mesh


# ---- scorer (no transformer architecture keys) ----
# n_target: 800             # Target mean leaf count (one global tolerance is calibrated to it)
# calib_samples: 256        # Train samples used for that calibration
# tv_weight: 0.2            # Total-variation regulariser on the depth map (0 = off)
# decision_weight: 0.0      # Decision-consistency term (0 = off, enable only if d_pred is jittery near decision boundaries)
# decision_margin: 0.0
# decision_temp: null       # Smooth-max temperature (null = hard max)


# ---- vit (reuses d_model / n_layers / n_heads / d_ff / dropout above; no max_patch_size / affine_output / warmup_steps) ----
# pos_embedding: sincos     # sincos | trainable. With sincos, d_model must be divisible by 4
# min_patch_size: 4         # On this branch: the ViT patch size (pixels). Must divide H and W
