# ---- Data ----
dataset: cylinder_dataset                    # wing_dataset | cavity_dataset | dam_dataset | cylinder_dataset | tube_dataset
input_file: "/mnt/data/tegeltija/cylinder"   # Folder holding the group sub-folders (bc, geo, prop)
val_split: 0.2                               # Fraction of *cases* held out for validation
