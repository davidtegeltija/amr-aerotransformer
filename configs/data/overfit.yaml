# ---- Data ----
dataset: wing_dataset                 # wing_dataset | cavity_dataset
input_file: "data/crmmgeom.npy"       # Path to .npz/.npy representing the geometry of the problem
target_file: "data/crmmdata.npy"      # Path to .npz/.npy representing the steady flow state
index_file: "data/crmmindex.npy"      # Path to .npz/.npy representing case operating conditions, aerodynamic coefficients
val_split: 0.1                        # Fraction of *geometries* held out for validation
seed: 42                              # RNG seed for the geometry-disjoint train/val split
