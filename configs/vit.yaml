# ViT baseline — dense prediction on [H, W, C] grids, NMSE loss only.

# ---- Model ----
model_trained: vit      # deterministic_transformer | learned_transformer | scorer | vit
d_model: 256            # Patch embedding width. Divisible by n_heads, and by 4 if pos_embedding=sincos
n_layers: 5             # Encoder blocks
n_heads: 8              # Attention heads. Must divide d_model
d_ff: 512               # Feed-forward inner width (previously mlp_ratio 2 x n_hidden 256)
dropout: 0.2
pos_embedding: sincos   # sincos | trainable
min_patch_size: 4       # The ViT patch size (pixels); must divide H and W

# ---- Training ----
epochs: 250
batch_size: 64
num_workers: 0          # DataLoader workers; only 0 keeps the AMR collates' per-sample mesh cache across epochs
